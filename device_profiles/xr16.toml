# Device profile for Behringer X-Air XR16
# Supports LAN RTA 100-band feedback detection and Main L/R + Aux Bus PEQ cuts

[device]
name = "Behringer XR16"
family = "X-Air"
port = 10024
max_clients = 4
heartbeat_interval_s = 8.0
client_timeout_s = 10.0
reconnect_timeout_s = 3.0
has_multichannel_usb = false
supports_rta_network = true

[channels]
# 8 Midas-designed mic preamp input channels
mic_channels = [1, 2, 3, 4, 5, 6, 7, 8]
# 8 TRS line-level input channels (9-16)
line_channels = [9, 10, 11, 12, 13, 14, 15, 16]
total_channels = 16

[buses]
# XR16 has 4 physical Aux output buses
aux_buses = [1, 2, 3, 4]

[eq]
# Main Stereo L/R has 6 PEQ bands; bands 1-2 reserved for FOH voicing, bands 3-6 for auto notch
main_auto_notch_bands = [3, 4, 5, 6]
auto_notch_bands = [3, 4]
bus_auto_notch_bands = [5, 6]
max_notches_per_channel = 2
max_notches_per_target = 4

# EQ parameter mapping specification
freq_min_hz = 20.0
freq_max_hz = 20000.0
freq_steps = 201

gain_min_db = -15.0
gain_max_db = 15.0
gain_steps = 121

q_min = 0.3
q_max = 10.0
q_steps = 72

[safety]
max_boost_db = 4.0
max_cut_db = -12.0
probe_step_db = -3.0
probe_wait_ms = 80
max_transactions_per_sec = 2.0
manual_override_lock_s = 10.0
auto_release_wait_s = 20.0
auto_release_rate_db_per_s = 1.0

[network]
default_mixer_ip = "192.168.1.100"
default_laptop_ip = "192.168.1.50"
default_subnet_mask = "255.255.255.0"
