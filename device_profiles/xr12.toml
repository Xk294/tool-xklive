# Hồ sơ thiết bị Behringer X-Air XR12
# Hỗ trợ tự động chống hú qua mạng LAN dựa trên RTA 100-band và can thiệp PEQ Main L/R

[device]
name = "Behringer XR12"
family = "X-Air"
port = 10024
max_clients = 4
heartbeat_interval_s = 8.0
client_timeout_s = 10.0
reconnect_timeout_s = 3.0
has_multichannel_usb = false
supports_rta_network = true

[channels]
# 4 kênh đầu vào mic preamps Midas-designed (cổng Combo XLR/TRS)
mic_channels = [1, 2, 3, 4]
# 8 kênh line level TRS (kênh 5-12)
line_channels = [5, 6, 7, 8, 9, 10, 11, 12]
total_channels = 12

[buses]
# XR12 có 2 cổng Aux Out vật lý
aux_buses = [1, 2]

[eq]
# Main Stereo L/R có 6 band PEQ.
# Giữ Band 1 & 2 cho Soundman tinh chỉnh âm sắc FOH, dùng Band 3, 4, 5, 6 làm Auto Notch
main_auto_notch_bands = [3, 4, 5, 6]
auto_notch_bands = [3, 4]
bus_auto_notch_bands = [5, 6]
max_notches_per_channel = 2
max_notches_per_target = 4

# Thông số ánh xạ tham số EQ
freq_min_hz = 20.0
freq_max_hz = 20000.0
freq_steps = 201

gain_min_db = -15.0
gain_max_db = 15.0
gain_steps = 121

q_min = 0.3
q_max = 10.0
q_steps = 72

[safety]
max_boost_db = 4.0
max_cut_db = -12.0
probe_step_db = -3.0
probe_wait_ms = 80
max_transactions_per_sec = 2.0
manual_override_lock_s = 10.0
auto_release_wait_s = 20.0
auto_release_rate_db_per_s = 1.0

[network]
default_mixer_ip = "192.168.1.100"
default_laptop_ip = "192.168.1.50"
default_subnet_mask = "255.255.255.0"
