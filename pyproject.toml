[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-sound"
version = "0.1.0"
description = "Hệ thống tự động phát hiện hú và hạ notch PEQ cho Behringer XR18"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "XK Live Sound Team" }
]
# Ghi chú bản quyền phụ thuộc:
# - numpy, scipy, uvicorn: BSD-3-Clause
# - python-osc: The Unlicense (Public Domain)
# - sounddevice, fastapi, pydantic, websockets: MIT
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "python-osc>=1.8.3",
    "sounddevice>=0.4.6",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "websockets>=11.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "hypothesis>=6.82.0",
    "pip-licenses>=4.3.0",
    "httpx>=0.24.0",
]

[project.scripts]
auto-sound = "auto_sound.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
